    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Josefin+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('grc_portal_theme_mode');
          var saved = localStorage.getItem('grc_portal_theme');
          var theme = 'light';
          if (mode === 'midnight' || saved === 'midnight') {
            theme = 'midnight';
          } else if (mode === 'light' || saved === 'light') {
            theme = 'light';
          } else if (mode === 'auto' || !mode) {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
              theme = 'midnight';
            } else {
              theme = 'light';
            }
          }
          var doc = document.documentElement;
          if (theme === 'midnight') {
            doc.classList.add('theme-midnight', 'dark');
            doc.classList.remove('theme-light');
            doc.setAttribute('data-theme', 'midnight');
            doc.style.colorScheme = 'dark';
          } else {
            doc.classList.add('theme-light');
            doc.classList.remove('theme-midnight', 'dark');
            doc.setAttribute('data-theme', 'light');
            doc.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased font-sans" style="font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
